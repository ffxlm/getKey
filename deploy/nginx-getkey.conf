# ===== nginx reverse proxy สำหรับ KEY Auto =====
# วิธีใช้:
#   sudo cp deploy/nginx-getkey.conf /etc/nginx/sites-available/getkey
#   sudo ln -s /etc/nginx/sites-available/getkey /etc/nginx/sites-enabled/getkey
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.com      # ออก HTTPS ให้อัตโนมัติ
#
# แก้ your-domain.com ให้เป็นโดเมนจริงก่อนใช้

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    client_max_body_size 2m;

    # (ไม่บังคับ) ใส่ Basic Auth กันคนนอกใช้ API
    # sudo apt install -y apache2-utils
    # sudo htpasswd -c /etc/nginx/.htpasswd youruser
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # งานหนึ่งใช้เวลาถึง ~90 วิ กัน proxy ตัดการเชื่อมต่อกลางทาง
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
