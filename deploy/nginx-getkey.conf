# ===== nginx reverse proxy สำหรับ KEY Auto (อยู่หลัง Cloudflare) =====
# รับ HTTP/HTTPS แล้วส่งต่อไปแอปที่ 127.0.0.1:3000
#
# วิธีใช้:
#   sudo cp deploy/nginx-getkey.conf /etc/nginx/sites-available/getkey
#   sudo ln -s /etc/nginx/sites-available/getkey /etc/nginx/sites-enabled/getkey
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d getkey.thirx.com      # ออก HTTPS ให้อัตโนมัติ
#
# หมายเหตุ: ถ้าไม่ได้อยู่หลัง Cloudflare ให้ลบ map ด้านล่าง และเปลี่ยน $client_ip เป็น $remote_addr

# ดึง IP จริงของผู้ใช้เมื่ออยู่หลัง Cloudflare
# (Cloudflare ส่ง IP ผู้ใช้จริงมาใน header CF-Connecting-IP)
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name getkey.thirx.com;

    client_max_body_size 2m;

    # (ไม่บังคับ) ใส่ Basic Auth กันคนนอกใช้ API
    # sudo apt install -y apache2-utils
    # sudo htpasswd -c /etc/nginx/.htpasswd youruser
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $client_ip;
        proxy_set_header X-Forwarded-For   $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # งานหนึ่งใช้เวลาถึง ~90 วิ กัน proxy ตัดการเชื่อมต่อกลางทาง
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- ส่วน HTTPS ด้านล่างนี้ certbot จะเป็นคนเพิ่มให้อัตโนมัติ ----
    # listen [::]:443 ssl ipv6only=on; # managed by Certbot
    # listen 443 ssl; # managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/getkey.thirx.com/fullchain.pem; # managed by Certbot
    # ssl_certificate_key /etc/letsencrypt/live/getkey.thirx.com/privkey.pem; # managed by Certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
